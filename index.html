<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Seb Saathi: the complete app to manage your apple orchard. Sprays and work diary, weather alerts, disease checks, season planning, sales and profit, for apple growers in Himachal Pradesh and Kashmir.">
<title>Seb Saathi – Your Orchard. Your Companion.</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F2F4EF">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seb Saathi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Khand:wght@500;600;700&family=Hind:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: a deep-green orchard band up top with a live example season, then a record-keeping calculator (orchards, years, lots), a yearly totals table, a plain roadmap list, and the apple year as a 12-month grid. */
:root{
  --bg:#F1F5EE;--surface:#FFFFFF;--surface-2:#E6EDE2;--fg:#15251B;--muted:#4F6256;--line:#C9D6C5;
  --brand:#1F4D34;--brand-bg:#1F4D34;--on-brand:#F1F5EE;--on-brand-soft:#B9D0C0;--on-brand-line:rgba(241,245,238,.25);
  --apple:#B8321F;--on-apple:#FFFFFF;
  --good:#16723F;--bad:#B3261E;
  --seg-lab:#8A6A45;--seg-pack:#3E7B58;--seg-comm:#C28A1E;--seg-year:#5F7391;--seg-profit:#16723F;
  --tree:rgba(241,245,238,.08);--tree-apple:rgba(210,80,60,.55);
  --display:"Bricolage Grotesque","Hind",system-ui,sans-serif;
  --body:"Hind",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1711;--surface:#15221A;--surface-2:#1C2D22;--fg:#E7F0E8;--muted:#9DB2A3;--line:#2B4033;
    --brand:#8FD3A8;--brand-bg:#173325;--on-brand:#E7F0E8;--on-brand-soft:#A9C4B1;--on-brand-line:rgba(231,240,232,.22);
    --apple:#CF4630;--on-apple:#FFFFFF;
    --good:#5FCB8A;--bad:#FF8A7D;
    --seg-lab:#B38D63;--seg-pack:#5DAE80;--seg-comm:#D9A441;--seg-year:#8398BA;--seg-profit:#5FCB8A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1711;--surface:#15221A;--surface-2:#1C2D22;--fg:#E7F0E8;--muted:#9DB2A3;--line:#2B4033;
  --brand:#8FD3A8;--brand-bg:#173325;--on-brand:#E7F0E8;--on-brand-soft:#A9C4B1;--on-brand-line:rgba(231,240,232,.22);
  --apple:#CF4630;--on-apple:#FFFFFF;
  --good:#5FCB8A;--bad:#FF8A7D;
  --seg-lab:#B38D63;--seg-pack:#5DAE80;--seg-comm:#D9A441;--seg-year:#8398BA;--seg-profit:#5FCB8A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
html[lang="hi"] h1,html[lang="hi"] h2,html[lang="hi"] h3{line-height:1.35}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--apple);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.section{padding-block:52px}
.section h2{font-size:clamp(1.6rem,5vw,2.3rem);font-weight:800;letter-spacing:-.01em}
.lede{color:var(--muted);max-width:62ch;margin-top:10px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em;text-decoration:none;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:14px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--apple)}
.nav{display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap;font-size:.95rem}
.nav a{text-decoration:none;color:var(--muted);padding:6px 0}
.nav a:hover{color:var(--fg)}
.lang{font:600 .9rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 14px;border-radius:8px;cursor:pointer;min-height:38px}

/* hero */
.hero{background:var(--brand-bg);color:var(--on-brand);position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:1}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:36px;padding-block:44px 92px;align-items:center}
.kicker{font:500 .8rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--on-brand-soft)}
html[lang="hi"] .kicker{text-transform:none;letter-spacing:.02em;font-size:.9rem}
.hero h1{font-size:clamp(2.2rem,8vw,4rem);font-weight:800;letter-spacing:-.02em;margin-top:14px}
.greet{font-family:var(--display);font-weight:600;font-size:1.15rem;margin-top:16px;color:var(--on-brand)}
.hero p.sub{color:var(--on-brand-soft);margin-top:12px;max-width:52ch}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;font:600 1rem var(--body);padding:13px 20px;border-radius:8px;text-decoration:none;border:1.5px solid transparent;cursor:pointer;min-height:48px;text-align:center}
.btn.primary{background:var(--apple);color:var(--on-apple)}
.btn.ghost{border-color:var(--on-brand-line);color:var(--on-brand);background:transparent}
.btn.ghost:hover{border-color:var(--on-brand)}
.sample{border:1px solid var(--on-brand-line);border-radius:12px;padding:20px;background:rgba(255,255,255,.05)}
.sample .tag{font:500 .75rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--on-brand-soft)}
html[lang="hi"] .sample .tag{text-transform:none;letter-spacing:.02em;font-size:.85rem}
.sample .fig{font:500 clamp(2rem,9vw,2.8rem) var(--mono);margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere}
.sample .meta{color:var(--on-brand-soft);font-size:.95rem;margin-top:4px;font-variant-numeric:tabular-nums}
.sample .note{margin-top:14px;padding-top:12px;border-top:1px dashed var(--on-brand-line);font-size:.85rem;color:var(--on-brand-soft)}
.rows{position:absolute;left:0;right:0;bottom:0;display:block;z-index:0}

/* calculator */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.tab{font:600 1rem var(--body);padding:10px 18px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);cursor:pointer;min-height:44px}
.tab[aria-selected="true"]{background:var(--brand-bg);color:var(--on-brand);border-color:var(--brand-bg)}
.status{margin-top:12px;font-size:.88rem;color:var(--muted);min-height:1.4em}
.panel{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;margin-top:14px;align-items:start}
.panel.single{grid-template-columns:minmax(0,1fr)}
.panel[hidden]{display:none}
fieldset{border:0;border-top:1px solid var(--line);margin:0 0 18px;padding:14px 0 0;min-width:0}
legend{font:500 .8rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 10px 0 0}
html[lang="hi"] legend{text-transform:none;letter-spacing:.02em;font-size:.95rem;font-family:var(--body);font-weight:600}
.hint{color:var(--muted);font-size:.9rem;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:14px}
.field{min-width:0}
.field label{display:block;font-size:.92rem;color:var(--muted);margin-bottom:5px;line-height:1.35}
.field input,.field select{width:100%;min-height:46px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:500 1.05rem var(--mono);font-variant-numeric:tabular-nums}
.field input[type="text"]{font-family:var(--body);font-weight:500}
.field select{font-family:var(--body)}
.actions{margin-top:6px}
.link{font:600 .95rem var(--body);background:none;border:0;color:var(--brand);text-decoration:underline;cursor:pointer;padding:8px 0}
.btn-s{font:600 .95rem var(--body);padding:9px 16px;min-height:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn-s.add{background:var(--brand-bg);color:var(--on-brand);border-color:var(--brand-bg)}
.btn-s.danger{color:var(--bad);border-color:var(--bad)}

/* record keeping */
.pick{display:flex;gap:8px;align-items:flex-end;max-width:640px}
.pick .field{flex:1 1 auto;min-width:0}
.pick .field.yr{flex:0 0 112px}
.pick .btn-s{flex:none;min-height:46px;padding-inline:18px}
.pick .btn-s:disabled{opacity:.45;cursor:default}
.entryform{margin-top:14px;border-color:var(--brand-bg);box-shadow:inset 0 0 0 1px var(--brand-bg)}
.entryform h4{font-size:1.1rem;font-weight:700;margin-bottom:10px}
.entryform .dels{margin-top:12px}
.entryform .linebox > .rowhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.entryform .rowhead b{font-size:.95rem}
.entryform > .btn-s{margin-top:12px}
.erow{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(7,minmax(0,1fr));gap:8px;align-items:end}
.erow .field label{font-size:.8rem;margin-bottom:3px;line-height:1.2}
.warn{margin:8px 0 0;display:grid;gap:4px}.warn:empty{display:none}
.warn span{display:block;padding:6px 10px;border-left:3px solid var(--warn,#C4851C);background:color-mix(in srgb,var(--warn,#C4851C) 12%,transparent);border-radius:0 6px 6px 0;font-size:.88rem;color:var(--fg)}
.lotbox .field input,.lotbox .field select{min-height:38px;padding:5px 8px;font-size:.95rem}
.lotbox .linebox{padding-top:8px;margin-top:8px}
.lotbox .lothead{margin-bottom:4px}
.lotbox .moreline{margin:4px 0 0;padding-top:0;border-top:0}
.lotbox .moreline summary{padding:4px 0;font-size:.85rem}
.entryform .rowhead b{font-size:.85rem;color:var(--muted)}
.lottab{margin-top:12px}
.lotbox .lottab{margin-top:6px}
.lothead2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lothead2 b{font-family:var(--display);font-size:1.05rem}
.lothead2 .link.del{color:var(--bad);font-size:.88rem}
.tpanel.adm{max-width:none;grid-template-columns:minmax(0,1fr)}
.adm>*{min-width:0}
#adErr:empty{display:none}
#adBody .ystats{margin-top:0}
.admbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.admbar .fine{margin:0}
.admfind{max-width:340px;margin-top:18px}
.fbadm{margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
.fbadm h4{font-family:var(--display);font-size:1.25rem;margin:0}
.fbadm .admbar{margin-top:10px}
.fbadm .tabs{margin-top:0}
#faList .tablewrap{margin-top:14px}
#faList table.ledger{min-width:760px}
#paList .tablewrap{margin-top:14px}
#paList table.ledger{min-width:900px}
#paList .tag{display:inline-block;font-size:.78rem;font-weight:600;padding:1px 6px;border-radius:6px;border:1px solid var(--bad);color:var(--bad)}
.fbst select.pa-pending{border-color:var(--apple);color:var(--apple)}
.fbst select.pa-approved{border-color:var(--good);color:var(--good)}
.fbst select.pa-rejected{border-color:var(--muted);color:var(--muted)}
.palogbox h5{font-family:var(--display);font-size:1.05rem;margin:22px 0 0}
.palog{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px;font-size:.92rem;max-height:320px;overflow:auto}
.palog li{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow-wrap:anywhere}
.palog time{display:block;font:500 .8rem var(--mono);color:var(--muted)}
#faList .ledger td,#faList .ledger th{vertical-align:top;text-align:left}
#faList .ledger td{font:400 .95rem var(--body)}
#faList .ledger td.n{font-family:var(--mono);text-align:right;color:var(--muted)}
#faList td.fbmsgc{white-space:pre-wrap;overflow-wrap:anywhere;min-width:240px;max-width:420px}
#faList td.fbwhen,#faList td.fbcont{white-space:normal;min-width:110px;max-width:200px;overflow-wrap:anywhere;color:var(--muted)}
#faList tr.done td,#faList tr.done th{opacity:.6}
#faList tr.done td.fbst{opacity:1}
.fbst select{min-height:36px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:600 .9rem var(--body)}
.fbst select.new{border-color:var(--apple);color:var(--apple)}
.fbst select.done{border-color:var(--good);color:var(--good)}
.fblist li{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);min-width:0}
.fblist li.done{opacity:.6}
.fbmeta{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.fbkind{font-weight:700;color:var(--fg)}
.fbkind.problem{color:var(--bad)}
.fbmsg{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.fbfoot{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:8px;font-size:.85rem;color:var(--muted)}
.fbfoot span{overflow-wrap:anywhere;min-width:0}
.admfind input{font-family:var(--body)!important}
#adTable .tablewrap{margin-top:10px}
#adTable .ledger{min-width:760px}
#adTable .ledger td{font-family:var(--body);font-size:.92rem}
#adTable .ledger td.n{font-family:var(--mono)}
#adTable .ledger th[scope=row]{font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis}
#adTable .tag{display:inline-block;font-size:.8rem;font-weight:600;padding:1px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
#adTable .tag.ok{color:var(--good);border-color:var(--good)}
#adTable .tag.me{color:var(--apple);border-color:var(--apple)}
#tp-orch.tpanel{max-width:none;grid-template-columns:minmax(0,1fr)}
#tp-orch .authcard{max-width:560px}
.subpanel{display:grid;gap:24px;min-width:0}
.status:empty{display:none}
#rp-year.panel,#rp-orch.panel{margin-top:0}
#rp-year .ysub:first-child{margin-top:0!important}
.pctabs{margin-top:0}
#tp-calc > .status{margin:0}
.dash{display:grid;gap:18px;margin-top:4px}
.dash .ystats{margin-top:0}
.ystats .sub{display:block;font-size:.8rem;color:var(--muted);margin-top:2px;font-weight:500}
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.ocard{border:1px solid var(--line);border-top:4px solid var(--apple);border-radius:12px;background:var(--surface);padding:14px 18px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ocard header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ocard h4{font-size:1.5rem;font-weight:700;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.ocard .otrees{color:var(--muted);font-size:.9rem;white-space:nowrap}
.ocard .olbl{color:var(--muted);font-size:.9rem;margin:0}
.ocard .onet{font:600 2rem var(--mono);font-variant-numeric:tabular-nums;line-height:1.05;margin:0}
.ocard .onet.pos{color:var(--good)}.ocard .onet.neg{color:var(--bad)}
.ocard .ochg{font-size:.88rem;color:var(--muted);margin:-4px 0 0}
.ocard dl.ostats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:2px 0 0}
.ocard dl.ostats div{display:block;border:0;padding:0}
.ocard dl.ostats dt{font-size:.8rem;color:var(--muted)}
.ocard dl.ostats dd{margin:0;text-align:left;font:500 1rem var(--mono)}
.ocard .ybars{margin:2px 0 0;gap:6px}
.ocard .ybars li{grid-template-columns:2.8rem minmax(0,1fr) auto;gap:10px}
.ocard .ybars .track{height:12px}
.ocard .ybars .yl,.ocard .ybars .yv{font-size:.85rem}
.ocard .ohint{font-size:.85rem;color:var(--muted);margin:0}
.ocard .oacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.ocard .oacts .btn-s{min-height:38px;padding:7px 12px;font-size:.9rem}
.ocard form{display:grid;gap:10px}
.ocard form .field input{min-height:40px}
.ocard .link.del{color:var(--bad);font-size:.9rem;justify-self:start}
.ocard.addc{border-top-width:1px;border-style:dashed;background:transparent;justify-content:center}
.ocard.addc p{color:var(--muted);margin:0}
.possel{max-width:260px;margin-bottom:8px}
.possel label{font-size:.8rem;margin-bottom:3px}
.lothead2 .lotmv{display:flex;gap:14px;margin-left:auto}
.lothead2 .lotmv .link{font-size:.88rem;padding:4px 0;color:var(--muted)}
.lothead2 b small{font-family:var(--body);font-weight:500;font-size:.9rem;color:var(--muted)}
.editbox{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.editbox .subhead{margin:0 0 2px}
.editbox .linebox{border-top:0;margin-top:0;padding-top:0}
.editbox .lname{max-width:320px;margin-top:8px}
.editbox .lname label{font-size:.8rem;margin-bottom:3px}
.editbox .dels{margin-top:10px}
.ledger tr.editing th,.ledger tr.editing td{background:var(--surface-2)}
.ledger.sm td.acts{white-space:nowrap;text-align:right;font-family:var(--body)}
.ledger.sm td.acts,.ledger.sm th.acts{position:sticky;right:0;background:var(--surface);box-shadow:-6px 0 6px -6px rgba(0,0,0,.25)}
.ledger.sm tr.editing td.acts{background:var(--surface-2)}
.ledger.sm td.acts .link{padding:2px 0;margin-left:12px;font-size:.88rem}
.ledger.sm td.acts .ed{color:var(--muted);font-size:.85rem;font-weight:600}
.ledger.sm td.acts .link.del{color:var(--bad)}
.lottab .tablewrap{margin-top:0}
.ledger.sm{min-width:520px}
.ledger.sm th,.ledger.sm td{padding:6px 10px;font-size:.88rem}
.ledger.sm td.t{text-align:left;font-family:var(--body)}
.lotbox{container-type:inline-size}
@media (max-width:640px){
  .erow{grid-template-columns:repeat(12,minmax(0,1fr))}
  .erow>.field:nth-child(-n+6){grid-column:span 4}
  .erow>.field:nth-child(n+7){grid-column:span 6}
  .erow .field label{font-size:.74rem}
}
@container (max-width:680px){
  .erow{grid-template-columns:repeat(12,minmax(0,1fr))}
  .erow>.field:nth-child(-n+6){grid-column:span 4}
  .erow>.field:nth-child(n+7){grid-column:span 6}
  .erow .field label{font-size:.74rem}
}
.entrymsg{margin-top:10px;color:var(--good);font-weight:600;min-height:0}
.addrow{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.addrow .field{flex:1}
.manage{margin:14px 0 18px;border-top:1px solid var(--line);padding-top:8px}
.manage summary{cursor:pointer;font-weight:600;padding:8px 0;color:var(--muted)}
.manage .grid{margin-top:10px}
.dels{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.confirm{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:.95rem}
.banner{margin-top:16px;padding:12px 14px;border:1px dashed var(--line);border-radius:8px;background:var(--surface-2);font-size:.92rem;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.headline{margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline;justify-content:space-between}
.headline span{color:var(--muted);min-width:0}
.headline b{font:500 1.5rem var(--mono);font-variant-numeric:tabular-nums}
.headline.pos b{color:var(--good)}.headline.neg b{color:var(--bad)}
.lotbox{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;background:var(--surface)}
.lothead{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px}
.lothead .field{flex:1}
.lotmargin{margin-top:12px;color:var(--muted);font-size:.92rem}
.lotmargin b{font:500 1rem var(--mono);color:var(--fg);font-variant-numeric:tabular-nums}
.empty{margin-top:18px;padding:18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}

.result{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;min-width:0}
.big-label{font:500 .8rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
html[lang="hi"] .big-label{text-transform:none;letter-spacing:.02em;font-family:var(--body);font-size:.95rem;font-weight:600}
.big{font:500 clamp(2rem,9vw,2.9rem) var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:4px;overflow-wrap:anywhere}
.big.pos{color:var(--good)}.big.neg{color:var(--bad)}
.persub{color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
dl{margin:18px 0 0;display:grid;gap:0}
dl div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--line)}
dt{color:var(--muted)}
dd{margin:0;font:500 1rem var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.result h4{font-size:1rem;margin-top:22px;font-weight:600}
.legend{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;font-size:.92rem}
.legend li{display:flex;align-items:center;gap:10px;min-width:0}
.legend b{width:12px;height:12px;border-radius:3px;flex:none}
.legend em{font-style:normal;margin-left:auto;font:500 .92rem var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.legend span{min-width:0}

/* year summary */
.yblock{margin-top:8px}
.yblock h4{font-family:var(--display);font-size:1.5rem;font-weight:800;margin-top:22px}
.ystats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-top:10px}
.ystats div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);min-width:0}
.ystats span{display:block;font-size:.85rem;color:var(--muted);line-height:1.3}
.ystats b{display:block;font:500 1.15rem var(--mono);font-variant-numeric:tabular-nums;margin-top:4px;overflow-wrap:anywhere}
.ystats .main{border-color:var(--fg)}
.ystats .main b{font-size:1.4rem}
.ystats .pos b{color:var(--good)}.ystats .neg b{color:var(--bad)}

/* lots with grade lines */
.grid.tight{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.linebox{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.lothead + .linebox{margin-top:0}
.checks{display:flex;gap:2px 20px;flex-wrap:wrap;margin-top:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:.95rem;min-height:40px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--brand-bg);flex:none}
.linecalc{margin-top:6px;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.linebox .link{padding:4px 0;font-size:.9rem}
.subhead{font-size:.92rem;font-weight:700;margin:12px 0 6px;color:var(--fg)}
.moreline{margin-top:10px}
.acctstrip{background:var(--surface-2);border-bottom:1px solid var(--line)}
.acctrow{display:flex;flex-wrap:wrap;align-items:center;gap:0 14px;padding-block:2px;font-size:.85rem;color:var(--muted)}
.acctrow span{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--fg)}
.acctrow .link{flex:none;font-size:.85rem;padding:8px 0;white-space:nowrap}
.lotbox > .btn-s{margin-top:10px}
fieldset > .btn-s.add{margin-bottom:12px}
.lotsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px 14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.lotsum span{display:block;font-size:.8rem;color:var(--muted)}
.lotsum b{font:500 .98rem var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.field input[type="date"]{font-family:var(--body);font-weight:500}

/* yearly totals */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:14px;background:var(--surface)}
table.ledger{border-collapse:collapse;width:100%;min-width:420px;font-variant-numeric:tabular-nums}
.ledger th,.ledger td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.ledger td{font:500 .98rem var(--mono)}
.ledger th{font-weight:600;color:var(--muted);font-size:.92rem}
.ledger th:first-child,.ledger td:first-child{text-align:left;font-family:var(--body)}
.ledger tbody th{color:var(--fg)}
.ledger tfoot th,.ledger tfoot td{border-top:2px solid var(--line);border-bottom:0;color:var(--fg)}
.ledger tfoot th{font-weight:700}
.ledger .pos{color:var(--good)}.ledger .neg{color:var(--bad)}.ledger .none{color:var(--muted)}
.ybars{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:12px}
.ybars li{display:grid;grid-template-columns:3.4rem minmax(0,1fr) auto;gap:12px;align-items:center}
.ybars .yl{font:500 .95rem var(--mono)}
.ybars .track{height:20px;border-radius:5px;background:var(--surface-2);overflow:hidden;display:block}
.ybars .fill{display:block;height:100%}
.ybars .fill.pos{background:var(--good)}.ybars .fill.neg{background:var(--bad)}
.ybars .yv{font:500 .95rem var(--mono);text-align:right;white-space:nowrap}
.ybars .ys{grid-column:2 / 4;color:var(--muted);font-size:.85rem;margin-top:-8px}
.ysub{margin-top:26px;font-size:1.05rem;font-weight:600}

.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.vs div{border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.vs .t{font-size:.9rem;color:var(--muted)}
.vs .n{font:500 clamp(1.1rem,5vw,1.5rem) var(--mono);font-variant-numeric:tabular-nums;margin-top:4px;overflow-wrap:anywhere}
.vs .p{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.vs div.win{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.verdict{margin-top:16px;font-family:var(--display);font-weight:600;font-size:1.15rem}
.fine{margin-top:12px;color:var(--muted);font-size:.88rem}

/* hero card and accounts */
.sample .lab{font-size:.9rem;color:var(--on-brand-soft);margin-top:12px}
.sample .fig{margin-top:2px}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.hrow span{display:block;font-size:.85rem;color:var(--on-brand-soft);line-height:1.3}
.hrow b{display:block;font:500 1.3rem var(--mono);font-variant-numeric:tabular-nums;margin-top:3px;overflow-wrap:anywhere}
.sample .meta{margin-top:12px}
.authcard{border:1px solid var(--line);border-radius:12px;padding:22px;background:var(--surface);max-width:560px}
.authcard h3{font-size:1.3rem;font-weight:800}
.authcard > p,.authcard .sentmsg{color:var(--muted);margin-top:8px}
.authcard form{display:grid;gap:12px;margin-top:16px}
.authcard .field input{font-family:var(--body)}
.autherr{color:var(--bad);font-size:.95rem;min-height:1.3em;margin:0}
.acctbar{display:flex;gap:8px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.95rem;color:var(--muted)}
.acctbar span{min-width:0;overflow-wrap:anywhere}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--surface-2);margin-top:10px}
.stack span{display:block;height:100%}

/* top bar and tabs */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .top{padding-block:10px 4px}
.tabbar{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tabbar .tab{flex:none;white-space:nowrap;border:0;border-bottom:3px solid transparent;border-radius:0;background:none;color:var(--muted);padding:10px 14px;min-height:46px;font:600 .98rem var(--body)}
.tabbar .tab:hover{color:var(--fg)}
.tabbar .tab[aria-selected="true"]{background:none;color:var(--fg);border-bottom-color:var(--apple)}
#tools{scroll-margin-top:120px;padding-top:18px}

/* tools */
.tpanel{margin-top:24px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px;max-width:880px}
.tpanel[hidden]{display:none}
.thead{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}
.thead h3{font-size:1.5rem;font-weight:800}
.tpanel > p,.tpanel .sub2{color:var(--muted);max-width:64ch}
.tpanel h4{font-size:1.05rem;font-weight:600}
.tpanel .sub2{margin-top:4px;font-size:.95rem}
.tcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:24px}
.tlist{margin:10px 0 0;padding-left:1.25em;color:var(--muted);display:grid;gap:7px}
.tnote{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface);color:var(--fg)!important}
.linkrow{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
.linkrow .sub2{margin-top:0}
.stages{list-style:none;counter-reset:st;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.stages li{counter-increment:st;padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);min-width:0;display:grid;gap:3px;align-content:start}
.stages li::before{content:counter(st);font:500 .78rem var(--mono);color:var(--muted)}
.stages b{font-family:var(--display);font-weight:600;font-size:1.02rem;line-height:1.3}
.stages span{color:var(--muted);font-size:.92rem;line-height:1.4}

/* roadmap */
.alt{background:var(--surface-2)}
.plan{list-style:none;margin:26px 0 0;padding:0;border-top:1px solid var(--line)}
.plan li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;padding:18px 0;border-bottom:1px solid var(--line)}
.plan h3{font-size:1.15rem;font-weight:600}
.plan p{color:var(--muted);max-width:60ch;margin-top:4px;font-size:.98rem}
.pill{align-self:start;font:500 .78rem var(--mono);padding:4px 10px;border:1px solid var(--line);border-radius:6px;white-space:nowrap;color:var(--muted)}
.pill.live{color:var(--good);border-color:var(--good)}
html[lang="hi"] .pill{font-family:var(--body);font-weight:600;font-size:.85rem}

/* calendar */
.months{list-style:none;margin:26px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.months li{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0;position:relative;background:var(--surface)}
.months .m{font:500 .78rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
html[lang="hi"] .months .m{text-transform:none;letter-spacing:.02em;font-family:var(--body);font-weight:600;font-size:.92rem}
.months .th{font-family:var(--display);font-weight:600;font-size:1.05rem;margin-top:4px;line-height:1.3}
.months li[aria-current="date"]{background:var(--brand-bg);color:var(--on-brand)}
.months li[aria-current="date"] .m{color:var(--on-brand-soft)}
.months .now{display:block;margin-top:8px;font:500 .75rem var(--mono);color:var(--on-brand-soft)}
html[lang="hi"] .months .now{font-family:var(--body);font-size:.85rem}

/* contact us */
.ctgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px;margin-top:22px;align-items:start}
.ctform{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.ctform textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:400 1rem var(--body);resize:vertical}
.ctform .btn-s{min-height:46px;justify-self:start;padding-inline:26px}
.ctform .autherr,.ctform .sentmsg{margin:0}
.ctother h3{font-size:1.1rem;font-weight:600}
.ctlinks{display:grid;gap:10px;margin-top:12px}
.ctlinks a{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.ctlinks a.wa{background:#1F7A45;border-color:#1F7A45;color:#fff}
.footlinks{margin-bottom:6px}.footlinks a{color:inherit;font-weight:600}

/* plans + UPI payment */
.plcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px;margin-top:26px;align-items:stretch}
.plcard{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.plcard.best{border:2px solid var(--brand)}
.plbadge{position:absolute;top:-12px;right:16px;background:var(--brand-bg);color:var(--on-brand);font:600 .78rem var(--body);padding:4px 10px;border-radius:6px}
.plcard h3{font-size:1.25rem;font-weight:700}
.pltag{color:var(--muted);font-size:.95rem;margin-top:2px}
.plprice{font-family:var(--display);font-weight:700;font-size:1.9rem;margin-top:14px;line-height:1.1}
.plprice small{font:500 .95rem var(--body);color:var(--muted)}
.plsub{color:var(--muted);font-size:.9rem;margin-top:2px}
.plcard ul{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px;font-size:.96rem}
.plcard li{position:relative;padding-left:24px;line-height:1.4}
.plcard li::before{content:"";position:absolute;left:3px;top:.35em;width:11px;height:6px;border-left:2.4px solid var(--brand);border-bottom:2.4px solid var(--brand);transform:rotate(-45deg)}
.plact{margin-top:auto;padding-top:18px;display:grid;gap:8px}
.plact .btn-s{width:100%;min-height:46px}
.plstat{font-weight:600;color:var(--muted);font-size:.92rem}
.plstat.good{color:var(--good)}
.paydlg h3{font-size:1.2rem;font-weight:800;margin:0}
.payper{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px}
.payper button{font:600 .92rem var(--body);min-height:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.payper button[aria-checked="true"]{background:var(--brand-bg);color:var(--on-brand);border-color:var(--brand-bg)}
.payamt{font-family:var(--display);font-weight:700;font-size:2rem;margin-top:12px;text-align:center}
.payapp{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;margin-top:10px;font-size:1.05rem;text-decoration:none}
.payqr{width:180px;margin:14px auto 0;background:#fff;padding:6px;border-radius:8px}
.payqr svg{display:block;width:100%;height:auto}
#payQrN{text-align:center}
.payto{margin-top:14px;font-size:.95rem;overflow-wrap:anywhere}
.payto code{font:500 .92rem var(--mono)}
.btn-s.sm{min-height:32px;padding:4px 10px;font-size:.85rem;margin-left:4px}
#payForm{margin-top:14px}
#payForm label{display:block;font-size:.92rem;margin-bottom:6px}

/* trust + join */
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:28px;margin-top:26px}
.three h3{font-size:1.15rem;font-weight:600}
.three p{color:var(--muted);margin-top:6px;font-size:.98rem}
.join{background:var(--brand-bg);color:var(--on-brand)}
.join h2{max-width:20ch}
.join p{color:var(--on-brand-soft);max-width:56ch;margin-top:10px}
.soc{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.soon{margin-top:18px;padding:12px 14px;border:1px dashed var(--on-brand-line);border-radius:8px;display:inline-block;font-size:.95rem}
footer{padding-block:26px;color:var(--muted);font-size:.88rem}
footer p{max-width:70ch}

@media (max-width:820px){
  .hero-grid{grid-template-columns:1fr;gap:28px;padding-block:32px 84px}
  .panel{grid-template-columns:1fr}
}
@media (max-width:420px){
  .vs{grid-template-columns:1fr}
  .plan li{grid-template-columns:1fr}
  .lothead{flex-wrap:wrap}
}

/* disease diagnosis */
.dxsec{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:18px}
.dxparts{display:flex;gap:8px;flex-wrap:wrap}
.dxparts .tab[aria-pressed="true"]{background:var(--brand-bg);color:var(--on-brand);border-color:var(--brand-bg)}
.dxsyms{display:grid;gap:2px}
.dxsyms .chk{align-items:flex-start;padding:6px 0;line-height:1.4}
.dxsyms .chk input{margin-top:2px}
.dxcards{display:grid;gap:12px;margin-top:6px}
.dxcard{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface);display:grid;gap:8px;min-width:0}
.dxcard.top{border-color:var(--brand-bg);box-shadow:inset 0 0 0 1px var(--brand-bg)}
.dxcard h5{font-size:1.1rem;font-weight:700;margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dxcard h5 .chip{margin-left:0}
.dxcard p{margin:0;color:var(--fg)}
.dxcard .k{font-weight:600}
.dxcard ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.dxcard .urgent{color:var(--bad);font-weight:600}
.chip.hi{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.dxgate{border:1px dashed var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px;justify-items:start}
.dxform{display:grid;gap:14px;max-width:560px}
.dxform textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:500 1rem var(--body);resize:vertical}
.dxform input[type="file"]{font:500 .95rem var(--body);padding:8px}
.dxthumbs{display:flex;gap:8px;flex-wrap:wrap}
.dxthumbs:empty{display:none}
.dxthumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.dxfb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* phone sign-in */
.authtabs{margin-top:14px}
.phrow{display:flex;align-items:stretch}
.phcc{display:flex;align-items:center;padding:0 12px;border:1px solid var(--line);border-right:0;border-radius:8px 0 0 8px;background:var(--surface-2);font:500 1.05rem var(--mono);color:var(--muted)}
.phrow input{border-radius:0 8px 8px 0!important;font-family:var(--mono)!important;letter-spacing:.03em}

.appbtn{display:inline-flex;align-items:center;gap:6px;border-color:var(--brand-bg);color:var(--brand)}
.appbtn svg{flex:none}
.sharebtn{display:inline-flex;align-items:center;justify-content:center;padding-inline:10px!important}
.sharebtn svg{flex:none}
.wa{text-decoration:none;background:#1F7A4A!important;color:#fff!important;border-color:#1F7A4A!important;display:inline-flex;align-items:center;gap:8px}
.sharedlg{border:0;border-radius:14px;padding:20px;width:min(440px,calc(100vw - 32px));background:var(--surface);color:var(--fg);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.sharedlg::backdrop{background:rgba(0,0,0,.4)}
.sharedlg h3{font-family:var(--display);font-size:1.3rem;margin:0}
.sharedlg > p{margin:6px 0 0;color:var(--muted)}
.sharemsg{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--surface-2);font-size:.95rem;white-space:pre-wrap;overflow-wrap:anywhere}
.sharebtns{display:grid;gap:10px;margin-top:14px}
.sharebtns .btn-s{justify-content:center;min-height:48px;font-size:1rem;width:100%}
.sharedlg .fine{margin:10px 0 0;min-height:1.2em}
.welcome-dlg .instdlg-head{margin-bottom:6px}
.join .sharecta{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}
.instdlg{border:0;border-radius:14px;padding:20px 20px 16px;max-width:min(420px,calc(100vw - 32px));background:var(--surface);color:var(--fg);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.instdlg::backdrop{background:rgba(20,14,10,.45)}
.instdlg-head{display:flex;align-items:center;gap:12px}
.instdlg-head img{border-radius:10px}
.instdlg-head h3{font-size:1.2rem;font-weight:800;margin:0}
.inststeps{margin:16px 0 0;padding-left:1.4em;display:grid;gap:10px;font-size:1rem;line-height:1.45}
.inststeps b{white-space:nowrap}
@media (max-width:480px){header.top{gap:8px;flex-wrap:nowrap}.nav{gap:6px;flex-wrap:nowrap;flex:none}.nav .lang{padding:7px 9px;font-size:.85rem}.appbtn{gap:4px}.brand{white-space:nowrap;min-width:0;font-size:clamp(1.1rem,5.2vw,1.5rem)!important}}

const HNX = {"Apple scab": "Apple scab (seb ka dhabba rog)", "Olive-green, velvety spots on leaves that turn dark. On fruit, dark scabby spots that can crack the skin.": "Patton par jaitooni-hare, makhmali dhabbe jo baad mein kaale ho jaate hain. Phal par kaale, khurdure dhabbe jo chhilke ko phaad sakte hain.", "Spring and early summer, after rain or long wet spells.": "Basant aur garmi ki shuruaat mein, baarish ya lambe geele mausam ke baad.", "Collect and destroy fallen leaves in autumn and winter. They carry the disease to next spring.": "Patjhad aur sardi mein gire patte ikattha karke nasht karein. Yahi agle basant tak bimari le jaate hain.", "Prune so air and light reach inside the tree and leaves dry fast.": "Aisi pruning/cutting karein ki ped ke andar hawa aur roshni pahunche aur patte jaldi sookhein.", "Remove badly spotted fruit.": "Bahut dhabbe wale phal hata dein.", "Sprays matter most from green tip to fruit set in wet weather.": "Geele mausam mein green tip se phal set tak ke spray sabse zaroori hain.", "Premature leaf fall (Marssonina blotch)": "Samay se pehle patta girna (Marssonina)", "Dark brown to blackish patches on the upper side of leaves. Leaves turn yellow and fall weeks too early.": "Patton ki upari satah par gehre bhoore se kaale dhabbe. Patte peele hokar hafton pehle gir jaate hain.", "Mostly July to September, after monsoon rain.": "Zyadatar July se September, barsaat ke baad.", "Collect and destroy fallen leaves.": "Gire hue patte ikattha karke nasht karein.", "Open up the canopy and keep grass and weeds short under trees in the monsoon.": "Ped ko khula rakhein aur barsaat mein pedon ke neeche ghaas aur kharpatwar chhoti rakhein.", "Check neighbouring trees, it spreads fast in wet weather.": "Paas ke pedon ko bhi dekhein, geele mausam mein ye tezi se failta hai.", "Monsoon sprays are key, so do not miss them.": "Barsaat ke spray sabse zaroori hain, inhe na chhodein.", "Alternaria leaf spot": "Alternaria patta dhabba", "Small round brown spots, often with a purple edge or rings. Spots can join up and leaves may fall.": "Chhote gol bhoore dhabbe, aksar baingani kinare ya chhallon ke saath. Dhabbe jud sakte hain aur patte gir sakte hain.", "Summer and monsoon, in warm wet weather.": "Garmi aur barsaat mein, garam aur geele mausam mein.", "Keep mites under control, mite damage makes it worse.": "Mite (lal makdi) ko kaabu mein rakhein, unka nuksaan ise badhata hai.", "Give balanced manure and fertiliser, a weak tree is hit harder.": "Santulit khaad aur gobar dein, kamzor ped par zyada asar hota hai.", "Powdery mildew": "Powdery mildew (safed choorni rog)", "White powder on young leaves, shoots and flowers. Leaves become narrow, curled and brittle.": "Nayi patton, tehniyon aur phoolon par safed powder. Patte patle, mude hue aur bhurbhure ho jaate hain.", "Spring, from bud break, in dry warm days with cool nights.": "Basant mein, kali khulne se, jab din sookhe aur garam aur raatein thandi hon.", "Cut out white-coated shoots and remove them from the orchard. Do this again at winter pruning.": "Safed powder wali tehniyan kaat kar bagiche se bahar karein. Sardi ki pruning/cutting mein phir karein.", "Do not overuse nitrogen fertiliser, soft new growth gets it most.": "Nitrogen khaad zyada na dein, naram nayi badhat par ye sabse zyada lagta hai.", "The early season sprays (pink bud and petal fall) matter most.": "Shuruaati season ke spray (pink bud aur pankhudi girna) sabse zaroori hain.", "Sooty blotch and flyspeck": "Sooty blotch aur flyspeck (phal par kaale dhabbe)", "Dark smudges or groups of tiny black dots on the fruit skin only. The flesh inside is fine.": "Sirf phal ke chhilke par kaale dhabbe ya chhote kaale binduon ke jhund. Andar ka gooda theek rehta hai.", "Late summer to harvest, in humid weather.": "Garmi ke aakhir se tudai tak, umas wale mausam mein.", "Prune for light and air, and keep weeds down.": "Roshni aur hawa ke liye pruning/cutting karein, aur kharpatwar kam rakhein.", "It lowers the grade but the fruit is safe to eat. Grade such fruit separately.": "Isse grade girta hai par phal khaane mein surakshit hai. Aise phal alag grade karein.", "Late season sprays help in humid years.": "Umas wale saalon mein season ke aakhir ke spray madad karte hain.", "Bitter pit (calcium shortage)": "Bitter pit (calcium ki kami)", "Small sunken brown spots on the fruit, often near the bottom. Under the skin the flesh is brown and spongy.": "Phal par chhote dhanse hue bhoore dhabbe, aksar neeche ki taraf. Chhilke ke neeche gooda bhoora aur spongy.", "Near harvest and in storage, worse on big fruit and light crops.": "Tudai ke paas aur store mein, bade phal aur kam fasal par zyada.", "This is not a disease and does not spread from tree to tree.": "Ye bimari nahi hai aur ek ped se doosre mein nahi failti.", "Avoid heavy nitrogen and very hard pruning.": "Zyada nitrogen aur bahut sakht pruning/cutting se bachein.", "Keep soil moisture even, avoid long dry spells.": "Mitti ki nami ek jaisi rakhein, lambe sookhe se bachein.", "Calcium sprays during fruit growth help. Keep spotted fruit out of storage boxes.": "Phal badhne ke samay calcium spray madad karte hain. Dhabbe wale phal store ki petiyon se bahar rakhein.", "Canker (bark disease)": "Canker (chhaal ki bimari)", "Sunken, cracked, dark or peeling patches of bark on branches or trunk. Branches above may dry up.": "Tehniyon ya tane par chhaal ke dhanse, phate, kaale ya utarte hisse. Upar ki tehniyan sookh sakti hain.", "Seen all year, easiest to spot in winter.": "Saal bhar dikhta hai, sardi mein pehchanna sabse aasaan.", "Scrape out the diseased bark down to healthy wood and cover the wound with the recommended wound paste.": "Bimar chhaal ko swasth lakdi tak khurach dein aur ghaav par salah ki gayi wound paste lagayein.", "Cut out dead branches in dry weather and remove them from the orchard.": "Sookhe mausam mein mari hui tehniyan kaat kar bagiche se bahar karein.", "Clean pruning tools between trees.": "Har ped ke baad pruning/cutting ke auzaar saaf karein.", "Avoid wounds and sunburn on the trunk.": "Tane par ghaav aur dhoop se jalne se bachayein.", "Collar rot": "Collar rot (tane ka galna)", "Bark at the base of the trunk, near the soil, turns dark and rotten. The tree gets weak, with small yellow leaves.": "Mitti ke paas tane ke neeche ki chhaal kaali aur sadi hui. Ped kamzor, chhote peele patton wala ho jaata hai.", "After wet seasons, in heavy or badly drained soil.": "Geele season ke baad, bhaari ya kharab nikasi wali mitti mein.", "Pull the soil away from the trunk base to see how far the rot goes.": "Tane ke neeche se mitti hata kar dekhein ki sadan kahan tak hai.", "Stop water standing near the trunk. Improve drainage.": "Tane ke paas paani rukne na dein. Nikasi theek karein.", "Do not pile manure or soil against the trunk.": "Tane se sata kar khaad ya mitti ka dher na lagayein.", "Get it checked quickly. Treatment should follow official advice.": "Jaldi jaanch karwayein. Ilaaj sarkari salah ke hisaab se ho.", "White root rot": "White root rot (safed jad galan)", "White threads or fan-like white growth on the roots. The tree has small yellow leaves, declines slowly or dies suddenly.": "Jadon par safed dhaage ya pankhe jaisi safed badhat. Ped ke chhote peele patte, dheere kamzor hota hai ya achanak mar jaata hai.", "Any time, worse after monsoon in wet soil.": "Kabhi bhi, barsaat ke baad geeli mitti mein zyada.", "It spreads through soil to nearby trees. Do not let water or soil run from this tree to healthy trees.": "Ye mitti se paas ke pedon mein failta hai. Is ped ka paani ya mitti swasth pedon ki taraf na jaane dein.", "Do not replant in the same pit without treating it.": "Usi gaddhe mein bina upchaar ke dobara ped na lagayein.", "Woolly apple aphid": "Woolly apple aphid (ruee wala keeda)", "White, cotton-like patches on twigs, pruning cuts or roots. Lumps and swellings form underneath.": "Tehniyon, kaant ke ghaav ya jadon par safed ruee jaise dhabbe. Neeche gaanthein aur sujan banti hai.", "Spring to autumn, on branches; on roots all year.": "Basant se patjhad tak tehniyon par; jadon par saal bhar.", "On small trees, brush or scrape off the white colonies.": "Chhote pedon par safed bastiyon ko brush se ya khurach kar hata dein.", "Protect natural enemies, avoid unneeded insecticide sprays.": "Prakritik dushman keedon ko bachayein, bina zaroorat keetnashak spray na karein.", "For new planting, MM-series rootstocks resist woolly aphid.": "Naye bagiche ke liye MM-series rootstock woolly aphid se bachav karte hain.", "Red spider mite": "Red spider mite (lal makdi)", "Leaves look dull, speckled or bronze. Tiny red dots move on the underside, sometimes with fine webbing.": "Patte phike, chitte ya kaanse jaise dikhte hain. Neeche chhote laal bindu chalte hain, kabhi baarik jaal ke saath.", "Hot dry summer weeks.": "Garmi ke garam aur sookhe hafte.", "Check the underside of 20 leaves from different trees, a hand lens helps.": "Alag-alag pedon ke 20 patton ki neeche ki satah dekhein, magnifying glass madad karta hai.", "Avoid unneeded insecticide sprays, they kill the insects that eat mites.": "Bina zaroorat keetnashak spray na karein, wo mite khaane wale keedon ko maar dete hain.", "Water stress makes it worse, irrigate if you can.": "Paani ki kami ise badhati hai, ho sake to sinchai karein.", "Spray only when numbers are high.": "Spray tabhi karein jab ginti zyada ho.", "San Jose scale": "San Jose scale", "Grey, crusty, tiny round scales on bark and twigs. On fruit, small red spots with a ring around them.": "Chhaal aur tehniyon par bhoore, papdi jaise chhote gol scale. Phal par chhalle wale chhote laal dhabbe.", "All year on bark, on fruit in summer.": "Chhaal par saal bhar, phal par garmi mein.", "Cut out and remove badly covered twigs at winter pruning.": "Sardi ki pruning/cutting mein bahut dhaki tehniyan kaat kar hata dein.", "The dormant season (winter) spray is the main control.": "Supt season (sardi) ka spray mukhya upaay hai.", "Stem or root borer": "Tana ya jad bedhak (borer)", "Holes in the trunk or branches with fresh sawdust-like powder. Root borer makes trees wilt and decline.": "Tane ya tehniyon mein chhed jinmein taaza burade jaisa powder. Jad bedhak se ped murjhate aur kamzor hote hain.", "Summer, but damage builds up over years.": "Garmi, par nuksaan saalon mein badhta hai.", "Clean out the hole with a thin wire to kill the grub, then plug it.": "Patle taar se chhed saaf karke keede ko maarein, phir band kar dein.", "Keep the trunk base clean and check trees every season.": "Tane ka neeche ka hissa saaf rakhein aur har season ped dekhein.", "If trees wilt with no trunk holes, check the roots and ask about root borer.": "Agar ped bina tane ke chhed ke murjha rahe hain, to jadein dekhein aur jad bedhak ke baare mein poochhein.", "Olive-green or dark velvety spots": "Jaitooni-hare ya gehre makhmali dhabbe", "Dark brown patches on the upper side, leaves turn yellow": "Upari satah par gehre bhoore dhabbe, patte peele hote hain", "Small round brown spots with a purple edge or rings": "Baingani kinare ya chhallon wale chhote gol bhoore dhabbe", "Leaves falling too early (July–September)": "Patte bahut jaldi gir rahe hain (July–September)", "White powder on young leaves, leaves curled and narrow": "Nayi patton par safed powder, patte mude aur patle", "Dull or bronze leaves, tiny red dots underneath": "Phike ya kaanse jaise patte, neeche chhote laal bindu", "Small, pale or yellow leaves all over the tree": "Poore ped par chhote, phike ya peele patte", "Dark, rough, scabby spots or cracks": "Kaale, khurdure dhabbe ya daraarein", "Dark smudges or tiny black dots that are only on the skin": "Kaale dhabbe ya chhote kaale bindu jo sirf chhilke par hain", "Small sunken brown spots, brown spongy flesh under the skin": "Chhote dhanse bhoore dhabbe, chhilke ke neeche bhoora spongy gooda", "Small red spots with a ring around them": "Chhalle wale chhote laal dhabbe", "Sunken, cracked, dark or p   if (P.village) f.push(P.village);
  if (+P.alt) f.push(tr("p_m").replace("{n}", fmtN(+P.alt)));
  if (P.var) f.push(P.var);
  return f.join(", ");
}

/* overall summary table at the top of the Dashboard: per orchard area, trees and trees by variety (from blocks, or a single listed variety), with a total row */
function farmSummaryHtml() {
  if (!S.orchards.length) return "";
  const names = {}, rows = S.orchards.map(o => {
    const P = o.profile || {}, t = +o.trees || 0, bl = (o.blocks || []).filter(b => +b.trees > 0), v = {}, vt = vtList(o);
    const addV = (name, n) => { const k = name.trim().toLowerCase(); if (!k || !(n > 0)) return; if (!names[k]) names[k] = name.trim(); v[k] = (v[k] || 0) + n; };
    let trees = t, un = 0;
    if (vt.length) {
      const vs = vt.reduce((a, x) => a + +x.n, 0); vt.forEach(x => addV(x.v, +x.n)); trees = Math.max(t, vs); if (t > vs) un += t - vs;
    } else if (bl.length) {
      const bt = bl.reduce((a, b) => a + (+b.trees || 0), 0);
      bl.forEach(b => { if ((b.var || "").trim()) addV(b.var, +b.trees); else un += +b.trees; });
      trees = Math.max(t, bt); if (t > bt) un += t - bt;
    } else {
      const vs = (P.var || "").split(/[,;/]| and /).map(x => x.trim()).filter(Boolean);
      if (t && vs.length === 1) addV(vs[0], t); else un += t;
    }
    return {o, area: +P.area || 0, trees, v, un};
  });
  const keys = Object.keys(names).sort((a, b) => rows.reduce((s2, r) => s2 + (r.v[b] || 0), 0) - rows.reduce((s2, r) => s2 + (r.v[a] || 0), 0));
  const anyUn = rows.some(r => r.un), sum = f => rows.reduce((a, r) => a + f(r), 0);
  const n = x => (x ? fmtN(x) : "–");
  const head = '<th scope="col">' + tr("cmp_o") + '</th><th scope="col">' + tr("p_area") + '</th><th scope="col">' + tr("sum_trees") + "</th>" +
    keys.map(k => '<th scope="col">' + esc(names[k]) + "</th>").join("") + (anyUn ? '<th scope="col">' + tr("sum_unsplit") + "</th>" : "");
  const cellV = (x, of) => (x ? '<span class="sv">' + fmtN(x) + '</span><span class="sbar"><i style="width:' + (of ? Math.max(4, Math.round(x / of * 100)) : 0) + '%"></i></span>' : '<span class="none">–</span>');
  const line = (lab, r) => '<th scope="row">' + lab + "</th><td>" + (r.area ? fmtD(r.area) : '<span class="none">–</span>') + '</td><td class="tt">' + n(r.trees) + "</td>" +
    keys.map(k => '<td class="vc">' + cellV(r.v[k] || 0, r.trees) + "</td>").join("") + (anyUn ? '<td class="vc un">' + cellV(r.un, r.trees) + "</td>" : "");
  const tot = {area: sum(r => r.area), trees: sum(r => r.trees), un: sum(r => r.un), v: {}}; keys.forEach(k => { tot.v[k] = sum(r => r.v[k] || 0); });
  return '<section class="osec" id="sumSec"><h4>' + tr("sum_h") + '</h4><p class="hint">' + tr(keys.length ? "sum_p" : "sum_p0") + '</p><div class="tablewrap"><table class="ledger sm ytab sumtab"><thead><tr>' + head + "</tr></thead><tbody>" +
    rows.map(r => "<tr>" + line('<span class="sname"><span class="sico" aria-hidden="true">' + treeArt(r.o.id + (r.o.name || "")) + "</span>" + esc(r.o.name || tr("orchard_fallback")) + "</span>", r) + "</tr>").join("") + "</tbody>" +
    (rows.length > 1 ? "<tfoot><tr>" + line(tr("sum_all").replace("{n}", fmtN(rows.length)), tot) + "</tr></tfoot>" : "") + "</table></div>" +
    (anyUn ? '<p class="fine">' + tr("sum_hint") + "</p>" : "") + "</section>";
}

  if (S.orchards.length) {

}

    const fld = (id, lab, inner, wide) => '<div class="field' + (wide ? " wide" : "") + '"><label for="' + id + '">' + tr(lab) + "</label>" + inner + "</div>";
    const inp = (id, type, v, extra) => '<input id="' + id + '" type="' + type + '"' + (extra || "") + ' value="' + esc(v == null ? "" : v) + '">';
    return '<form class="pform" data-dform="prof">' +
      fld("p_name", "f_oname", inp("p_name", "text", o.name, ' maxlength="60"')) +

      fld("p_area", "p_area", inp("p_area", "number", P.area || "", ' inputmode="decimal" min="0" step="any"')) +

      fld("p_planted", "p_planted", inp("p_planted", "number", P.planted || "", ' inputmode="numeric" min="1950" max="' + thisYear() + '" step="1"')) +
      fld("p_var", "p_var", inp("p_var", "text", P.var, ' maxlength="120" placeholder="' + esc(tr("p_var_ph")) + '"' + (vtList(o).length ? " disabled" : "")), true) +

      fld("p_root", "p_root", '<select id="p_root">' + opt(ROOTS, "r_", P.root) + "</select>") +
      fld("p_irr", "p_irr", '<select id="p_irr">' + opt(IRR, "i_", P.irr) + "</select>") +
      fld("p_hail", "p_hail", '<select id="p_hail">' + opt(HAIL, "h_", P.hail) + "</select>") +
      '<div class="dels wide"><button class="btn-s add" type="submit">' + tr("d_save") + '</button><button class="btn-s" type="button" data-dact="pcancel">' + tr("d_cancel") +
      '</button><button class="link del" type="button" data-dact="del" data-o="' + esc(o.id) + '">' + tr("d_del") + "</button></div></form>";
  }
  const f = [];
  const add = (k, v) => { if (v) f.push("<div><dt>" + tr(k) + "</dt><dd>" + v + "</dd></div>"); };
  add("p_village", esc(P.village));
  add("p_alt", +P.alt ? tr("p_m").replace("{n}", fmtN(+P.alt)) : "");
  add("p_area", +P.area ? tr("p_bigha").replace("{n}", fmtD(P.area)) : "");
  add("d_trees", trees ? fmtN(trees) : "");
  add("p_var", vtList(o).length ? vtList(o).map(x => esc(x.v) + " " + fmtN(+x.n)).join(", ") : esc(P.var));
  add("p_root", P.root ? tr("r_" + P.root) : "");
  add("p_planted", +P.planted ? P.planted + " (" + tr("p_age").replace("{n}", Math.max(0, thisYear() - +P.planted)) + ")" : "");
  add("p_irr", P.irr ? tr("i_" + P.irr) : "");
  add("p_hail", P.hail ? tr("h_" + P.hail) : "");
  return (f.length ? '<dl class="pfacts">' + f.join("") + "</dl>" : "") + (f.length < 4 ? '<p class="hint">' + tr("o_noprof") + "</p>" : "");
}

function insightsHtml(o, Y) {
  const se = seFor(o.id, Y), trees = +o.trees;
  let h = "";
  if (!se || !se.lots.some(l => l.lines.some(n => +n.boxes))) {
    h += '<p class="empty">' + tr("o_nosales").replace("{y}", Y) + '</p>';
  } else {
    const r = seasonCalc(se), g = gradeSplit(se);
    const tile = (lab, val, extra, sub) => "<div" + (extra ? ' class="' + extra + '"' : "") + "><span>" + tr(lab) + "</span><b>" + val + "</b>" + (sub ? '<span class="sub">' + sub + "</span>" : "") + "</div>";
    const noT = tr("k_addtrees");
    h += '<div class="ystats">' + tile("k_net", inr(r.profit), "main " + dcls(r.profit)) +
      tile("k_npt", trees ? inr(r.profit / trees) : "–", "", trees ? "" : noT) + tile("k_bpt", trees ? fmtD(r.boxes / trees) : "–", "", trees ? "" : noT) +
      tile("k_avg", inr(r.boxes ? r.rev / r.boxes : 0)) + tile("k_ash", pct(g.a.b, r.boxes), "", tr("k_ofb").replace("{n}", fmtN(g.a.b)).replace("{m}", fmtN(r.boxes))) +
      tile("k_due", inr(r.due)) + "</div>";
  }
  // season timeline from the diary
  const tl = ((o.diary || []).filter(d => hYear(d.date) === +Y && TIMELINE_KINDS.indexOf(d.kind) >= 0)).sort((a, b) => (a.date < b.date ? -1 : 1));
  h += '<section class="osec"><h4>' + tr("s_timeline") + "</h4>" + (tl.length
    ? '<ol class="tl">' + tl.map(d => '<li class="k-' + d.kind + '"><b>' + fmtDay(d.date) + "</b> " + tr("dk_" + d.kind) + (d.text ? '<span class="tlt">' + esc(d.text) + "</span>" : "") + "</li>").join("") + "</ol>"
    : '<p class="hint">' + tr("s_tl_none") + "</p>") + "</section>";
  if (!se) return h;
  const r = seasonCalc(se), g = gradeSplit(se);

  // grade mix, year by year
  const ss = S.seasons.filter(x => x.oid === o.id).sort((a, b) => a.year - b.year);
  const used = GK.filter(k => ss.some(x => gradeSplit(x)[k].b > 0));
  h += '<section class="osec"><h4>' + tr("s_grades") + '</h4><p class="hint">' + tr("s_grades_p") + "</p>";
  if (used.length) {
    h += '<ul class="glegend">' + used.map(k => '<li><i class="gc-' + k + '"></i>' + tr("gk_" + k) + "</li>").join("") + "</ul>" +
      '<ul class="gmix">' + ss.map(x => {
        const gs = gradeSplit(x), tot = GK.reduce((a, k) => a + gs[k].b, 0);
        if (!tot) return "";
        return '<li><span class="yl">' + x.year + '</span><span class="gstack" role="img" aria-label="' + esc(used.map(k => tr("gk_" + k) + " " + pct(gs[k].b, tot)).join(", ")) + '">' +
          used.filter(k => gs[k].b).map(k => '<span class="gc-' + k + '" style="flex:' + gs[k].b + '" title="' + esc(tr("gk_" + k) + ": " + fmtN(gs[k].b) + " (" + pct(gs[k].b, tot) + ")") + '"></span>').join("") +
          '</span><span class="yv">' + fmtN(tot) + "</span></li>";
      }).join("") + "</ul>";
    h += '<div class="tablewrap"><table class="ledger sm"><thead><tr>' + ["gt_grade", "gt_boxes", "gt_share", "gt_avg", "gt_gross"].map(k => '<th scope="col">' + tr(k) + "</th>").join("") +
      "</tr></thead><tbody>" + GK.filter(k => g[k].b).map(k => '<tr><th scope="row"><i class="sw gc-' + k + '"></i>' + tr("gk_" + k) + "</th><td>" + fmtN(g[k].b) + "</td><td>" + pct(g[k].b, r.boxes) +
      "</td><td>" + inr(g[k].gross / g[k].b) + "</td><td>" + inr(g[k].gross) + "</td></tr>").join("") + "</tbody></table></div>" +
      '<p class="fine">' + tr("gt_note").replace("{y}", Y) + "</p>";
  }
  h += "</section>";

  // prices
  h += '<section class="osec"><h4>' + tr("s_prices") + "</h4>";
  const lots = se.lots.map((l, i) => { const c = lotCalc(l); return {l, i, b: c.b, avg: c.b ? c.gross / c.b : 0}; }).filter(x => x.b);
  if (lots.length > 1) {
    const best = lots.reduce((a, c) => (c.avg > a.avg ? c : a)), low = lots.reduce((a, c) => (c.avg < a.avg ? c : a));
    h += '<div class="ystats two"><div><span>' + tr("s_best") + "</span><b>" + inr(best.avg) + '</b><span class="sub">' + esc(lotLabel(best.l, best.i)) + ", " + tr("k_ofb2").replace("{n}", fmtN(best.b)) + "</span></div>" +
      "<div><span>" + tr("s_low") + "</span><b>" + inr(low.avg) + '</b><span class="sub">' + esc(lotLabel(low.l, low.i)) + ", " + tr("k_ofb2").replace("{n}", fmtN(low.b)) + "</span></div></div>";
  }
  const months = {};
  se.lots.forEach(l => l.lines.forEach(n => { const b = +n.boxes || 0; if (!n.date || !b) return; const m = n.date.slice(0, 7); months[m] = months[m] || {b: 0, g: 0}; months[m].b += b; months[m].g += b * (+n.rate || 0); }));
  const mk = Object.keys(months).sort();
  if (mk.length) {
    const mx = Math.max.apply(null, mk.map(m => months[m].g / months[m].b)) || 1;
    h += '<p class="subhead">' + tr("s_byMonth") + '</p><ul class="pbars">' + mk.map(m => {
      const v = months[m].g / months[m].b, nm = new Date(m + "-01T00:00:00").toLocaleDateString(dloc(), {month: "long"});
      return '<li><span class="yl">' + nm + '</span><span class="track"><span class="fill" style="width:' + (v / mx * 100).toFixed(1) + '%" title="' + esc(inr(v) + ", " + tr("k_ofb2").replace("{n}", fmtN(months[m].b))) +
        '"></span></span><span class="yv">' + inr(v) + '</span><span class="ys">' + tr("k_ofb2").replace("{n}", fmtN(months[m].b)) + "</span></li>";
    }).join("") + "</ul>";
  } else h += '<p class="hint">' + tr("s_nodates") + "</p>";
  h += "</section>";

  // where the money goes
  const costTab = x => {
    const t = {}; if (!x) return null;
    LINE_COSTS.forEach(([k]) => { t[k] = 0; });
    x.lots.forEach(l => l.lines.forEach(n => LINE_COSTS.forEach(([k]) => { t[k] += k === "com" ? lineCalc(n).com : (+n.boxes || 0) * (+n[k] || 0); })));
    const rr = seasonCalc(x); COST_KEYS.forEach(k => { t["y_" + k] = (+x.costs[k] || 0) + rr.dcosts[k]; });
    return t;
  };
  const cur = costTab(se), prevSe = seFor(o.id, Y - 1), prv = costTab(prevSe);
  const keys = LINE_COSTS.map(([k, lab]) => [k, lab]).concat(COST_KEYS.map(k => ["y_" + k, "yc_" + k]));
  const shown = keys.filter(([k]) => cur[k] || (prv && prv[k]));
  h += '<section class="osec"><h4>' + tr("s_money") + "</h4>";
  if (shown.length) {
    const tot = shown.reduce((a, [k]) => a + cur[k], 0), ptot = prv ? shown.reduce((a, [k]) => a + prv[k], 0) : 0;
    h += '<div class="tablewrap"><table class="ledger sm"><thead><tr><th scope="col">' + tr("m_item") + '</th><th scope="col">' + tr("m_total") + '</th><th scope="col">' + tr("m_pb") +
      '</th><th scope="col">' + tr("m_pt") + "</th>" + (prv ? '<th scope="col">' + (Y - 1) + "</th>" : "") + "</tr></thead><tbody>" +
      shown.map(([k, lab]) => '<tr><th scope="row">' + tr(lab) + "</th><td>" + inr(cur[k]) + "</td><td>" + (r.eq ? inr(cur[k] / r.eq) : "–") + "</td><td>" + (trees ? inr(cur[k] / trees) : "–") + "</td>" +
        (prv ? "<td>" + inr(prv[k]) + "</td>" : "") + "</tr>").join("") +
      '</tbody><tfoot><tr><th scope="row">' + tr("m_all") + "</th><td>" + inr(tot) + "</td><td>" + (r.eq ? inr(tot / r.eq) : "–") + "</td><td>" + (trees ? inr(tot / trees) : "–") + "</td>" +
      (prv ? "<td>" + inr(ptot) + "</td>" : "") + "</tr></tfoot></table></div>" + (trees ? "" : '<p class="fine">' + tr("k_addtrees2") + "</p>");
  } else h += '<p class="hint">' + tr("m_none") + "</p>";
  h += "</section>";
  return h;
}

function dueHtml(o) {
  const rows = [], now = new Date(todayIso() + "T00:00:00");
  S.seasons.filter(x => x.oid === o.id).forEach(x => x.lots.forEach((l, i) => l.lines.forEach(n => {
    const gross = (+n.boxes || 0) * (+n.rate || 0);
    if (!n.paid && gross > 0) rows.push({y: x.year, l, i, n, gross, days: n.date ? Math.max(0, Math.round((now - new Date(n.date + "T00:00:00")) / 864e5)) : null});
  })));
  rows.sort((a, b) => a.y - b.y || (a.n.date || "9") .localeCompare(b.n.date || "9"));
  let h = '<section class="osec"><h4>' + tr("s_due") + "</h4>";
  if (!rows.length) return h + '<p class="hint">' + tr("s_due_none") + "</p></section>";
  const tot = rows.reduce((a, x) => a + x.gross, 0);
  h += '<div class="tablewrap"><table class="ledger sm"><thead><tr>' + ["d_year", "d_lot", "f_type", "ls_boxes", "d_amt", "d_sold", "d_wait"].map(k => '<th scope="col">' + tr(k) + "</th>").join("") + "</tr></thead><tbody>" +
    rows.map(x => '<tr><th scope="row">' + x.y + '</th><td class="t">' + esc(lotLabel(x.l, x.i)) + '</td><td class="t">' + esc((GRADE_KEY[x.n.grade] ? tr(GRADE_KEY[x.n.grade]) : x.n.grade) || "–") + "</td><td>" + fmtN(+x.n.boxes) +
      "</td><td>" + inr(x.gross) + "</td><td>" + fmtDay(x.n.date, true) + "</td><td>" + (x.days == null ? "–" : tr("d_days").replace("{n}", fmtN(x.days))) + "</td></tr>").join("") +
    '</tbody><tfoot><tr><th scope="row" colspan="4">' + tr("d_tot") + "</th><td>" + inr(tot) + '</td><td colspan="2"></td></tr></tfoot></table></div>' +
    '<p class="fine">' + tr("d_due_note") + "</p></section>";
  return h;
}

function shrinkPhoto(file) {
  return new Promise((ok, bad) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 720 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = 0.75, d = c.toDataURL("image/jpeg", q);
      while (d.length > 160000 && q > 0.35) { q -= 0.1; d = c.toDataURL("image/jpeg", q); }
      ok(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad(); };
    img.src = url;
  });
}

function treeArt(seed) {

  const spots = [[17, 19], [26, 14], [34, 20], [21, 27], [31, 28], [27, 22], [14, 25], [38, 26], [24, 32], [35, 15]];
  for (let i = spots.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = spots[i]; spots[i] = spots[j]; spots[j] = t; }
  const n = 4 + Math.floor(rnd() * 3);
  return '<svg viewBox="0 0 52 52" width="52" height="52" focusable="false"><rect width="52" height="52" class="ta-sky"/><path d="M0 44 Q26 36 52 44 V52 H0Z" class="ta-hill"/>' +

    '<circle cx="26" cy="21" r="13" class="ta-leaf"/><circle cx="17" cy="24" r="8" class="ta-leaf"/><circle cx="35" cy="24" r="8" class="ta-leaf"/><circle cx="22" cy="15" r="7" class="ta-leaf2"/>' +
    spots.slice(0, n).map(([x, y]) => '<circle cx="' + x + '" cy="' + y + '" r="2.6" class="ta-apple"/><circle cx="' + (x - 0.8) + '" cy="' + (y - 0.9) + '" r=".8" class="ta-shine"/>').join("") + "</svg>";

let LP = null, MAPS = [];
function loadLeaflet() {

  if (LP) return LP;
  LP = new Promise((ok, bad) => {
    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(css);
    const s = document.createElement("script"); s.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    s.onload = () => ok(window.L); s.onerror = () => { LP = null; bad(); }; document.head.appendChild(s);
  });
  return LP;
}
function mountMaps() {
  MAPS.forEach(m => { try { m.remove(); } catch (e) {} }); MAPS = [];
  const els = document.querySelectorAll("[data-map]"); if (!els.length) return;
  loadLeaflet().then(L => {
    document.querySelectorAll("[data-map]").forEach(el => {
      if (el._m) return;
      const id = el.dataset.map, list = id === "farm" ? S.orchards.filter(hasLoc) : S.orchards.filter(o => o.id === id);
      const o1 = id === "farm" ? null : list[0];

      el._m = m; MAPS.push(m);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 18, attribution: "© OpenStreetMap"}).addTo(m);
      const pts = [];

        L.circleMarker(p, {radius: 9, color: "#fff", weight: 2, fillColor: "#B11F24", fillOpacity: 1}).addTo(m)
          .bindTooltip(esc(o.name || tr("orchard_fallback")) + (+o.profile.alt ? ", " + fmtN(+o.profile.alt) + " m" : ""), {permanent: id === "farm", direction: "top", offset: [0, -8]});
      });
      if (pts.length > 1) m.fitBounds(pts, {padding: [36, 36], maxZoom: 14});
      else if (pts.length) m.setView(pts[0], 14);
      else m.setView([31.2, 77.6], 8);

}

function renderSummary() {

  let h = '<div class="tablewrap"><table class="ledger ytab ygrid"><thead><tr><th scope="col">' + tr("y_orch") + "</th>" +
    years.map(y => '<th scope="col">' + y + "</th>").join("") + '<th scope="col">' + tr("y_total") + "</th></tr></thead><tbody>";
  S.orchards.forEach(o => {
    let rowTot = 0;
    h += '<tr><th scope="row">' + esc(o.name || tr("orchard_fallback")) + "</th>";

}

function dxShrink(file) {
  return new Promise((ok, bad) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1024, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error("img")); };
    img.src = url;
  });
}

function dashDxRecent() {

  else h += '<ul class="dxhist">' + dxHist.slice(0, 3).map(x => {

    const when = new Date(x.created_at).toLocaleDateString(lang === "hi" ? "hi-IN" : "en-IN", {day: "numeric", month: "short"});

document.addEventListener("click", e => {
  const a = e.target.closest("[data-lp]");
  if (a) { goLogin(a.dataset.lp === "join"); return; }
  const c = e.target.closest("[data-lgo]"); if (!c) return;
  let w = c.dataset.lgo;
  if (w === "rec" && user) w = "orch";   /* logged in: Orchard Record is their own record */
  if (w === "chat") { $("chatFab").click(); return; }
  if (w === "wx") {   /* Weather and alerts: open Orchard Record at its weather section */
    tabPicked = true;
    if (user) { if (dashView) { dashView = null; profEdit = false; diaryEdit = null; renderDash(); } showTool("orch", false, false); }
    else showTool("rec", false, false);
    const t = user ? document.querySelector("#dash .wxsec") : $("recWx");
    if (t) {   /* scroll so the weather sits just below the sticky header and tabs */
      const tb = $("tabbar"), top = tb ? tb.getBoundingClientRect().bottom : 0, hh = Math.max(0, Math.min(top, 200));
      window.scrollTo({top: window.scrollY + t.getBoundingClientRect().top - hh - 10});
      const after = tb ? tb.getBoundingClientRect().bottom : 0;
      if (after > hh + 1) window.scrollBy(0, -(after - hh));
    } else if ($("tools").scrollIntoView) $("tools").scrollIntoView({block: "start"});
    return;
  }
  tabPicked = true; showTool(w, false, true);
});

function prSetup() {
  clearInterval(prTimer); prTimer = null; prIdx = 0;
  const t = $("prTrack"); if (!t) return;
  prMark();
  let raf = 0;
  t.addEventListener("scroll", () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const sl = prSlides(), x = t.scrollLeft + sl[0].offsetLeft;
      let best = 0; sl.forEach((el, k) => { if (Math.abs(el.offsetLeft - x) < Math.abs(sl[best].offsetLeft - x)) best = k; });
      if (best !== prIdx) { prIdx = best; prMark(); }
    });
  }, {passive: true});
  ["pointerdown", "touchstart", "wheel", "focusin"].forEach(ev => t.addEventListener(ev, prHold, {passive: true}));
  t.addEventListener("keydown", e => { if (e.key === "ArrowRight") { e.preventDefault(); prHold(); prGo(prIdx + 1); } else if (e.key === "ArrowLeft") { e.preventDefault(); prHold(); prGo(prIdx - 1); } });
  const calm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!calm && !prHeld) prTimer = setInterval(() => {
    const vis = t.offsetParent !== null && !document.hidden;
    const r = t.getBoundingClientRect();
    if (vis && r.bottom > 0 && r.top < innerHeight) prGo(prIdx + 1);
  }, 6000);
}

function libInline(t) {
  return t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")

function libMd(src) {

  return blocks.map(b => {
    const lines = b.split("\n").filter(l => l.trim());
    if (!lines.length) return "";
    let out = "", list = [];
    const flush = () => { if (list.length) { out += "<ul>" + list.map(x => "<li>" + libInline(x) + "</li>").join("") + "</ul>"; list = []; } };
    let para = [];
    const flushP = () => { if (para.length) { out += "<p>" + para.map(libInline).join("<br>") + "</p>"; para = []; } };
    lines.forEach(l => {
      const t = l.trim();
      if (/^#{2,3}\s+/.test(t)) { flushP(); flush(); out += "<h4>" + libInline(t.replace(/^#+\s+/, "")) + "</h4>"; }
      else if (/^[-•*]\s+/.test(t)) { flushP(); list.push(t.replace(/^[-•*]\s+/, "")); }

const NEWS = {}, NEWS_SHOW = 8;
let newsOpen = false, newsBusy = {};
function newsCached(l) { try { const c = JSON.parse(localStorage.getItem("ad-news-" + l) || "null"); return c && Array.isArray(c.items) ? c : null; } catch (e) { return null; } }
async function loadNews(force) {
  const l = lang;
  if (!NEWS[l]) { const c = newsCached(l); if (c) NEWS[l] = c; }
  const fresh = NEWS[l] && NEWS[l].got && Date.now() - NEWS[l].got < 20 * 60000;
  renderNews();
  if ((fresh && !force) || newsBusy[l]) return;
  newsBusy[l] = true;
  let data = null;
  try {
    const r = await fetch("/api/news?lang=" + (l === "hn" ? "hi" : l));
    if (r.ok) data = await r.json();
  } catch (e) {}
  newsBusy[l] = false;
  if (data && Array.isArray(data.items) && data.items.length) {
    NEWS[l] = {items: data.items, at: data.at, got: Date.now()};
    try { localStorage.setItem("ad-news-" + l, JSON.stringify(NEWS[l])); } catch (e) {}
  } else if (!NEWS[l]) NEWS[l] = {items: [], failed: true};
  if (l === lang) { renderNews(); refreshDashNews(); }
}
function newsWhen(iso) {
  if (!iso) return "";
  const d = new Date(iso), mins = Math.round((Date.now() - d) / 60000);
  if (mins < 60 * 20) {
    const h = Math.max(1, Math.round(mins / 60));
    if (lang === "hn") return mins < 60 ? Math.max(1, mins) + " min pehle" : h + " ghante pehle";
    return lang === "hi" ? (mins < 60 ? Math.max(1, mins) + " मिनट पहले" : h + " घंटे पहले") : (mins < 60 ? Math.max(1, mins) + " min ago" : h + (h === 1 ? " hour ago" : " hours ago"));
  }
  return adWhen(iso);
}
function renderNews() {

  if (!n.items.length) {
    $("newsList").innerHTML = '<li class="newsmsg">' + tr("nw_err") + ' <button class="link" type="button" id="newsRetry">' + tr("nw_retry") + "</button></li>";
    $("newsMore").hidden = true; set("newsAt", ""); return;

function dashNewsInner() {
  const n = NEWS[lang], lab = '<span class="tklab" title="' + esc(tr("dn_h")) + '"><span aria-hidden="true">📰</span><span class="tkl">' + esc(tr("dn_h")) + "</span></span>",

  const items = n.items.slice(0, 10);
  const one = hide => '<ul class="tkset"' + (hide ? ' aria-hidden="true"' : "") + ">" + items.map(x => '<li><a href="' + esc(x.url) + '" target="_blank" rel="noopener"' + (hide ? ' tabindex="-1"' : "") + ">" + esc(x.title) +

async function chatHistory() {

    let r = await q("id,role,content,created_at,feedback");
    if (r.error) r = await q("id,role,content,created_at");
    if (!r.error && r.data && r.data.length && !CHAT.length) { CHAT = r.data.reverse().map(m => ({role: m.role, content: m.content, id: m.id, fb: m.feedback || 0})); renderChat(); }

function renderChat() {

async function chatAsk(text) {
  text = String(text || "").trim();
  if (!text || chatBusy || !user) return;
  chatErr = ""; CHAT.push({role: "user", content: text}); chatBusy = true;
  $("chatIn").value = ""; chatGrow(); renderChat();
  let token = "";
  try { const r = await sb.auth.getSession(); token = r && r.data && r.data.session ? r.data.session.access_token : ""; } catch (e) {}
  let data = null, status = 0;
  if (token) {
    try {
      const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json", Authorization: "Bearer " + token},
        body: JSON.stringify({messages: CHAT.slice(-12), lang})});
      status = r.status; data = await r.json().catch(() => null);
    } catch (e) { status = 0; }
  } else status = 401;
  chatBusy = false;
  if (data && data.reply) { CHAT.push({role: "assistant", content: data.reply, id: data.id || null, fb: 0}); chatLeft = typeof data.left === "number" ? data.left : null; }
  else {
    CHAT.pop(); $("chatIn").value = text; chatGrow();
    const e = data && data.error;
    chatErr = e === "limit" ? tr("ch_e_limit").replace("{n}", data.limit || "") : e === "not_setup" ? tr("ch_e_setup") : status === 401 ? tr("ch_e_signin") : tr("ch_e_net");
  }
  renderChat();
}

async function chatRateSet(i, v, note) {

  const c = wxGet(guestPlace()), d = c.d;

  if (d) return wxIcon(d.weather_code[0], false) + esc(wcWord(d.weather_code[0]) + " · " + Math.round(d.temperature_2m_max[0]) + "° / " + Math.round(d.temperature_2m_min[0]) + "°");
  return esc(tr("wx_load"));
}
/* weather for visitors: shown at the top of Orchard Record, like the logged-in record page */
function renderGuestWx() {
  const el = $("recWx"), nw = $("recNews"); if (!el) return;
  if (user || !T.en.gd_place) { el.innerHTML = ""; if (nw) nw.innerHTML = ""; return; }
  if (nw) try { nw.innerHTML = dashNewsHtml(); } catch (e) { nw.innerHTML = ""; }
  el.innerHTML = '<h4>' + tr("wx_h_dash") + "</h4>" +
    '<div data-wx="guest">' + wxBlock([guestPlace()], false, true) + "</div>";
}
function renderGuestDash() {
  const el = $("guestDash"); if (!el) return;
  el.hidden = !!user;
  if (user || !T.en.gd_place) { el.innerHTML = ""; return; }
  renderGuestWx();
  el.innerHTML = "";   /* news and weather now sit at the top of Orchard Record */
}
/* ---- top tabs ---- */
const TT = ["orch","rec","calc","diag","spray","news","cal","mandi","buy"];  /* Library tab removed from the site; its articles still feed Saathi */
function showTool(w, focus, scroll) {
  TT.forEach(n => {
    $("tp-" + n).hidden = n !== w;
    const b = $("tt-" + n);
    b.setAttribute("aria-selected", n === w ? "true" : "false");
    b.tabIndex = n === w ? 0 : -1;
    if (n === w) {
      if (focus) b.focus();
      if (b.scrollIntoView) b.scrollIntoView({block:"nearest", inline:"nearest"});
    }
  });
  if (scroll && $("tools").scrollIntoView) $("tools").scrollIntoView({block:"start"});
  if (w === "news") loadNews();
  if (w === "rec") renderRec();
}
TT.forEach((n, i) => {
  const b = $("tt-" + n);
  b.addEventListener("click", () => { tabPicked = true; showTool(n, false, true); });
  b.addEventListener("keydown", e => {
    const vis = TT.filter(t => !$("tt-" + t).hidden), k = vis.indexOf(n);
    let j = -1;
    if (e.key === "ArrowRight") j = (k + 1) % vis.length;
    else if (e.key === "ArrowLeft") j = (k + vis.length - 1) % vis.length;
    else if (e.key === "Home") j = 0;
    else if (e.key === "End") j = vis.length - 1;
    if (j >= 0) { e.preventDefault(); showTool(vis[j], true, false); }
  });
});
showTool("orch");
libWant = null;
if (window.ADFeedback) ADFeedback.init({
  getSb: () => sb, getLang: () => lang, getUser: () => user,
  getPage: () => { const n = TT.find(x => !$("tp-" + x).hidden); return n ? tr("tt_" + n) : "Home"; }
});
applyLang();
</script>
